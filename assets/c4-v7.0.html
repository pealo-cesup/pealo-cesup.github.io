<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C4 Model v7.0 — Incidentes CESUP/UFRGS</title>
<style>
:root {
  --bg:#12141c; --canvas:#171a26; --hdr:#0e1018;
  --border:#252a3a; --text:#dde2f0; --muted:#6a7590; --accent:#4a7cf7;
  --person-f:#0e2a40; --person-s:#2a7ab8; --person-t:#90ccf5;
  --sys-f:#0e1e3a; --sys-s:#2a50c0; --sys-t:#90b0f8;
  --ext-f:#1e1800; --ext-s:#806020; --ext-t:#c8a040;
  --wa-f:#061a10; --wa-s:#1a8030; --wa-t:#50d870;
  --web-f:#06101e; --web-s:#1a40a0; --web-t:#70a0f0;
  --api-f:#061a14; --api-s:#0a7058; --api-t:#40c8a8;
  --db-f:#160a22; --db-s:#7020b0; --db-t:#c060e8;
  --que-f:#100618; --que-s:#5820a0; --que-t:#a060d8;
  --ai-f:#1a0608; --ai-s:#a02020; --ai-t:#e06060;
  --zbx-f:#1a0a00; --zbx-s:#cc5500; --zbx-t:#ff9944;
  --tg-f:#071a26;  --tg-s:#2a8bc9;  --tg-t:#7cc4f0;
  --sg-f:#0b1433;  --sg-s:#3a76f0;  --sg-t:#9dbaf8;
  --off-f:#15171c; --off-s:#4a4f5c; --off-t:#7d8496;
  --arr:#3a4a6a; --arrl:#607090;
  --glow:rgba(74,124,247,.3);
  --r:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter','Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--hdr);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;flex-shrink:0}
#backBtn{background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;padding:4px 10px;border-radius:4px;cursor:pointer;transition:.15s}
#backBtn:hover{color:var(--text);border-color:var(--muted)}
#backBtn:disabled{opacity:.3;cursor:default}
#breadcrumb{flex:1;font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#breadcrumb b{color:var(--text)}
#lvlpill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;background:rgba(74,124,247,.18);color:var(--accent);flex-shrink:0}
.hint{font-size:11px;color:var(--muted);flex-shrink:0}
@media(max-width:600px){.hint{display:none}}
.wrap{flex:1;overflow:auto;position:relative}
.canvas{position:relative;animation:fi .18s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
svg.arr{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.node{position:absolute;border-radius:var(--r);padding:11px 9px 9px;border:1.5px solid;text-align:center;display:flex;flex-direction:column;align-items:center}
.node.click{cursor:pointer;transition:transform .12s,box-shadow .12s}
.node.click:hover{transform:translateY(-2px);box-shadow:0 0 0 3px var(--glow)}
.ni{font-size:19px;margin-bottom:4px;line-height:1}
.nn{font-size:11.5px;font-weight:600;line-height:1.3;margin-bottom:3px}
.nt{font-size:9.5px;font-style:italic;opacity:.7;margin-bottom:4px}
.nd{font-size:10px;line-height:1.5;opacity:.85}
.dh{font-size:9px;margin-top:5px;padding:2px 7px;border-radius:8px;background:rgba(255,255,255,.07);opacity:.75}
.person{background:var(--person-f);border-color:var(--person-s);color:var(--person-t)}
.sys   {background:var(--sys-f);   border-color:var(--sys-s);   color:var(--sys-t)}
.ext   {background:var(--ext-f);   border-color:var(--ext-s);   color:var(--ext-t);border-style:dashed}
.wa    {background:var(--wa-f);    border-color:var(--wa-s);    color:var(--wa-t)}
.web   {background:var(--web-f);   border-color:var(--web-s);   color:var(--web-t)}
.api   {background:var(--api-f);   border-color:var(--api-s);   color:var(--api-t)}
.db    {background:var(--db-f);    border-color:var(--db-s);    color:var(--db-t)}
.que   {background:var(--que-f);   border-color:var(--que-s);   color:var(--que-t)}
.ai    {background:var(--ai-f);    border-color:var(--ai-s);    color:var(--ai-t)}
.zbx   {background:var(--zbx-f);   border-color:var(--zbx-s);   color:var(--zbx-t)}
.tg    {background:var(--tg-f);    border-color:var(--tg-s);    color:var(--tg-t)}
.sg    {background:var(--sg-f);    border-color:var(--sg-s);    color:var(--sg-t)}
.off   {background:var(--off-f);   border-color:var(--off-s);   color:var(--off-t);border-style:dotted;opacity:.8}
.off .nn::after{content:' (desligado)';font-weight:400;font-size:9.5px}
.new::before{content:'NOVO v7';position:absolute;top:-8px;right:-6px;font-size:8px;font-weight:700;padding:1px 5px;border-radius:6px;background:#2a8bc9;color:#fff;letter-spacing:.04em}
.bnd{position:absolute;border:1px dashed var(--border);border-radius:8px}
.bnd-lbl{position:absolute;top:-9px;left:12px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--canvas);padding:0 5px}
.leg{position:absolute;bottom:14px;left:14px;background:rgba(14,16,24,.88);border:1px solid var(--border);border-radius:var(--r);padding:9px 13px;display:flex;flex-direction:column;gap:5px}
.li{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted)}
.ls{width:13px;height:13px;border-radius:3px;border:1.5px solid;flex-shrink:0}
/* N4 */
.n4p{padding:22px;max-width:860px;margin:0 auto}
.n4p h2{font-size:14px;font-weight:600;margin-bottom:4px;color:var(--text)}
.n4p .sub{font-size:11px;color:var(--muted);margin-bottom:18px}
.n4p h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:20px 0 8px}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;padding:6px 10px;background:rgba(255,255,255,.04);color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)}
td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top;color:var(--text)}
tr:hover td{background:rgba(255,255,255,.02)}
code{font-size:10.5px;color:var(--api-t)}
.tag{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:7px;margin-right:2px}
.GET {background:#06180e;color:#50d870} .POST{background:#06101e;color:#70a0f0}
.PUT {background:#1e1800;color:#c8a040} .DEL {background:#1a0608;color:#e06060}
.perm{font-size:10px;color:var(--muted);font-style:italic}
.note{margin-top:14px;padding:9px 13px;border-left:3px solid var(--accent);background:rgba(74,124,247,.07);font-size:11px;color:var(--muted);border-radius:0 4px 4px 0;line-height:1.6}
.note.zbx{border-left-color:var(--zbx-s);background:rgba(204,85,0,.07)}
.note.tg{border-left-color:var(--tg-s);background:rgba(42,139,201,.08)}
.note.sg{border-left-color:var(--sg-s);background:rgba(58,118,240,.08)}
.note.off{border-left-color:var(--off-s);background:rgba(120,120,140,.08)}
.sflow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.sbox{padding:6px 12px;border-radius:4px;font-size:11px;font-weight:600;border:1.5px solid}
.sa{background:var(--sys-f);border-color:var(--sys-s);color:var(--sys-t)}
.se{background:var(--wa-f);border-color:var(--wa-s);color:var(--wa-t)}
.sr{background:#101800;border-color:#607000;color:#b0d040}
.sl{background:var(--ai-f);border-color:var(--ai-s);color:var(--ai-t)}
.sarr{color:var(--arr);font-size:14px}
pre{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:4px;padding:10px 12px;font-size:10.5px;color:var(--zbx-t);overflow-x:auto;line-height:1.7;margin-top:6px}
</style>
</head>
<body>
<header>
  <button id="backBtn" onclick="goBack()" disabled>← Voltar</button>
  <div id="breadcrumb"><b>Contexto do Sistema</b></div>
  <div id="lvlpill">N1</div>
  <div class="hint">🔍 Clique nas caixas para detalhar</div>
  <div style="font-size:10px;color:var(--muted);margin-left:auto;padding-right:8px;white-space:nowrap" title="v7.0: multicanal (WhatsApp pela ponte WAHA, Signal), vínculo por QR code e instalador. Base: versão final v6.1, revisada por recomendação do Prof. Dr. Diego Kreutz">v7.0 · <b style="color:var(--tg-t)">multicanal</b> · rec. Prof. Dr. Diego Kreutz · 175 testes · <a href="https://github.com/douglaslautert/cesup_incidentes" target="_blank" rel="noopener" style="color:var(--tg-t)">github.com/douglaslautert/cesup_incidentes</a></div>
</header>
<div class="wrap" id="wrap"></div>
<script>
const $=id=>document.getElementById(id);
const hist=[];
let cur=null;
function nd({id,x,y,w=148,icon,name,type,desc,th,drill,hint}){
  const el=document.createElement('div');
  el.className='node '+(th||'')+(drill?' click':'');
  el.id='nd-'+id;
  el.style.cssText=`left:${x}px;top:${y}px;width:${w}px;`;
  el.innerHTML=`<div class="ni">${icon}</div><div class="nn">${name}</div><div class="nt">${type}</div><div class="nd">${desc}</div>`+(drill?`<div class="dh">🔍 ${hint||'detalhar'}</div>`:'');
  if(drill) el.onclick=()=>nav(drill,name);
  return el;
}
function bnd({x,y,w,h,label}){
  const el=document.createElement('div');el.className='bnd';
  el.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;`;
  if(label) el.innerHTML=`<div class="bnd-lbl">${label}</div>`;
  return el;
}
function mksvg(W,H){
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('class','arr');s.setAttribute('viewBox',`0 0 ${W} ${H}`);
  s.innerHTML=`<defs>
    <marker id="ah"  markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#3a4a6a"/></marker>
    <marker id="ahz" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#cc5500"/></marker>
  </defs>`;
  return s;
}
function ar(svg,x1,y1,x2,y2,lbl,bend,zabbix){
  const mx=(x1+x2)/2,my=(y1+y2)/2;
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  const col=zabbix?'#cc5500':'#3a4a6a';
  const mkr=zabbix?'url(#ahz)':'url(#ah)';
  p.setAttribute('fill','none');p.setAttribute('stroke',col);
  p.setAttribute('stroke-width',zabbix?'2':'1.5');
  if(zabbix)p.setAttribute('stroke-dasharray','6,3');
  p.setAttribute('marker-end',mkr);
  p.setAttribute('d',bend?`M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`:`M${x1},${y1} L${x2},${y2}`);
  svg.appendChild(p);
  if(lbl){
    const tw=lbl.length*5.2+8;
    const bg=document.createElementNS('http://www.w3.org/2000/svg','rect');
    bg.setAttribute('x',mx-tw/2);bg.setAttribute('y',my-8);bg.setAttribute('width',tw);bg.setAttribute('height',13);bg.setAttribute('rx',3);bg.setAttribute('fill','#171a26');
    svg.appendChild(bg);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',mx);t.setAttribute('y',my+2.5);t.setAttribute('fill',zabbix?'#cc5500':'#607090');
    t.setAttribute('font-size','9.5');t.setAttribute('text-anchor','middle');t.setAttribute('font-family',"'Inter',system-ui,sans-serif");
    t.textContent=lbl;svg.appendChild(t);
  }
}
function leg(items){
  const el=document.createElement('div');el.className='leg';
  el.innerHTML=items.map(([bg,bc,bd,bs])=>`<div class="li"><div class="ls" style="background:${bg};border-color:${bc};${bs||''}"></div>${bd}</div>`).join('');
  return el;
}
function cx(x,w=148){return x+w/2}
function nav(id,label){hist.push({id:cur?.id||'n1',label:cur?.label||'Contexto'});cur={id,label};renderLevel(id,label)}
function goBack(){if(!hist.length)return;const p=hist.pop();cur=p;renderLevel(p.id,p.label)}
function renderLevel(id,label){
  $('wrap').innerHTML='';
  const lmap={n1:'N1',n2:'N2',n3:'N3'};
  $('lvlpill').textContent=id.startsWith('n4')?'N4':lmap[id.split('-')[0]]||'N4';
  const chain=[...hist,{id,label}];
  $('breadcrumb').innerHTML=chain.map((h,i)=>i<chain.length-1?`<span style="opacity:.45">${h.label}</span> <span style="opacity:.3">›</span> `:`<b>${h.label}</b>`).join('');
  $('backBtn').disabled=hist.length===0;
  const fn=LEVELS[id];
  if(fn){const r=fn();$('wrap').appendChild(r);}
}

// ── N1 ───────────────────────────────────────────────────────────────────────
const LEVELS={};
LEVELS.n1=()=>{
  const W=1020,H=900;
  const c=document.createElement('div');c.className='canvas';c.style.cssText=`width:${W}px;height:${H}px`;
  const svg=mksvg(W,H);
  // pessoas
  c.appendChild(nd({id:'usr',x:55, y:30,w:145,icon:'👤',name:'Usuário',      type:'[Pessoa]',         desc:'Registra incidentes e equipamentos pelo Telegram, WhatsApp ou Signal (voz, foto, vídeo, documento) ou pela web',th:'person'}));
  c.appendChild(nd({id:'tec',x:220,y:30,w:145,icon:'🔧',name:'Técnico de TI',type:'[Pessoa]',         desc:'Atende incidentes; notificado por e-mail, Telegram e WhatsApp; baixa anexos',th:'person'}));
  c.appendChild(nd({id:'adm',x:385,y:30,w:145,icon:'🛡️',name:'Administrador',type:'[Pessoa]',         desc:'Gerencia usuários, permissões, canais (QR codes), relatórios e auditoria',th:'person'}));
  // sistema
  c.appendChild(nd({id:'sis',x:290,y:230,w:200,icon:'📋',name:'Sistema de Incidentes',type:'[Sistema — escopo]',desc:'Registro conversacional de incidentes e inventário do datacenter universitário',th:'sys',drill:'n2',hint:'ver contêineres'}));
  // externos (baixo): os três canais de chat primeiro
  c.appendChild(nd({id:'wa', x:20, y:480,w:150,icon:'💬',name:'WhatsApp',          type:'[Sistema Externo]',desc:'Número do bot pareado por QR code (WhatsApp Web, ponte WAHA)',th:'wa new',drill:'n4-waha',hint:'ver canal'}));
  c.appendChild(nd({id:'sg', x:185,y:480,w:150,icon:'🔵',name:'Signal',            type:'[Sistema Externo]',desc:'Conta vinculada por QR code (aparelho vinculado, signal-cli)',th:'sg new',drill:'n4-sig',hint:'ver canal'}));
  c.appendChild(nd({id:'tg', x:350,y:480,w:150,icon:'✈️',name:'Telegram Bot API', type:'[Sistema Externo]',desc:'@incidentes_dtic_unipampa_bot; long polling, sem URL pública',th:'tg',drill:'n4-tga',hint:'ver canal'}));
  c.appendChild(nd({id:'st', x:515,y:480,w:150,icon:'🎙️',name:'Whisper local',    type:'[faster-whisper]', desc:'Transcrição de áudio e da trilha de vídeos, com vocabulário de TI',th:'ext',drill:'n4-stt',hint:'ver detalhes'}));
  c.appendChild(nd({id:'sm', x:680,y:480,w:150,icon:'📧',name:'Servidor SMTP',    type:'[Gmail]',          desc:'E-mails de notificação com os anexos do chamado',th:'ext'}));
  c.appendChild(nd({id:'gg', x:845,y:480,w:150,icon:'🔑',name:'Google OAuth',      type:'[Sistema Externo]',desc:'Autenticação via conta Google',th:'ext'}));
  // Zabbix e a API oficial do WhatsApp (desligada), à direita
  c.appendChild(nd({id:'zbx',x:730,y:200,w:200,icon:'📡',name:'Zabbix',           type:'[Monitor Externo]',desc:'Monitora infraestrutura; dispara alertas automáticos como incidentes via webhook',th:'zbx',drill:'n4-zbx',hint:'ver integração'}));
  c.appendChild(nd({id:'wcl',x:760,y:40,w:170,icon:'🚫',name:'WhatsApp Cloud API',type:'[Meta · oficial]',desc:'Conta Meta bloqueada',th:'off',drill:'n4-wa-off',hint:'por que desligado'}));
  // pessoas → sistema
  ar(svg,cx(55,145),184,cx(290,200)-40,230,'chat/web');
  ar(svg,cx(220,145),169,cx(290,200)+10,230,'web/chat');
  ar(svg,cx(385,145),154,cx(290,200)+60,230,'painel web');
  // sistema → externos
  ar(svg,330,335,cx(20,150),480,'WhatsApp Web');
  ar(svg,355,335,cx(185,150),480,'Signal');
  ar(svg,380,335,cx(350,150),480,'Telegram');
  ar(svg,405,335,cx(515,150),480,'áudio');
  ar(svg,430,335,cx(680,150),480,'e-mail + anexos');
  ar(svg,455,335,cx(845,150),480,'OAuth2');
  ar(svg,490,255,760,110,'desligado');
  // Zabbix → sistema (laranja tracejado)
  ar(svg,730,270,490,270,'webhook HTTP',false,true);
  c.appendChild(svg);
  c.appendChild(leg([
    ['var(--person-f)','var(--person-s)','Pessoa'],
    ['var(--sys-f)','var(--sys-s)','Sistema (escopo) — clicável'],
    ['var(--wa-f)','var(--wa-s)','WhatsApp (ponte WAHA) — clicável'],
    ['var(--sg-f)','var(--sg-s)','Signal — clicável'],
    ['var(--tg-f)','var(--tg-s)','Telegram — clicável'],
    ['var(--ext-f)','var(--ext-s)','Sistema externo','border-style:dashed'],
    ['var(--off-f)','var(--off-s)','Desligado (Cloud API da Meta) — clicável','border-style:dotted'],
    ['var(--zbx-f)','var(--zbx-s)','Zabbix (monitor) — clicável'],
  ]));
  return c;
};

// ── N2 ───────────────────────────────────────────────────────────────────────
LEVELS.n2=()=>{
  const W=1060,H=1040;
  const c=document.createElement('div');c.className='canvas';c.style.cssText=`width:${W}px;height:${H}px`;
  const svg=mksvg(W,H);
  // pessoas
  c.appendChild(nd({id:'p1',x:55, y:25,w:138,icon:'👤',name:'Usuário',      type:'[Telegram/WhatsApp/Signal]',desc:'Registra por voz, foto, vídeo, documento ou texto',th:'person'}));
  c.appendChild(nd({id:'p2',x:215,y:25,w:138,icon:'🔧',name:'Técnico',       type:'[Navegador/chat]',desc:'Atende incidentes',th:'person'}));
  c.appendChild(nd({id:'p3',x:375,y:25,w:138,icon:'🛡️',name:'Administrador', type:'[Navegador]', desc:'Gestão, canais e auditoria',th:'person'}));
  // boundary
  c.appendChild(bnd({x:25,y:180,w:740,h:480,label:'Sistema de Registro de Incidentes'}));
  // contêineres internos
  c.appendChild(nd({id:'bot',x:50, y:220,w:152,icon:'🤖',name:'Bot multicanal', type:'[Python/FastAPI · bot]',desc:'Telegram e Signal (polling), WhatsApp (webhook do WAHA); transcreve; interpreta; anexa',th:'wa', drill:'n3-bot',hint:'ver componentes'}));
  c.appendChild(nd({id:'wbe',x:230,y:220,w:152,icon:'🌐',name:'Interface Web',type:'[React + Bootstrap 5 · web]',    desc:'Painel; nginx: /api, /ws, /webhook',th:'web',drill:'n3-web',hint:'ver componentes'}));
  c.appendChild(nd({id:'api',x:415,y:220,w:152,icon:'⚙️',name:'API Backend',  type:'[Python/FastAPI · api]',desc:'Negócio, anexos, SLA, auditoria, vínculo dos canais; Alembic no boot',th:'api',drill:'n3-api',hint:'ver componentes'}));
  c.appendChild(nd({id:'wah',x:600,y:220,w:150,icon:'🔗',name:'Ponte WAHA',     type:'[devlikeapro/waha · waha]',desc:'WhatsApp Web (GOWS), pareado por QR',th:'wa new',drill:'n4-waha',hint:'ver canal'}));
  c.appendChild(nd({id:'sgc',x:600,y:375,w:150,icon:'🔵',name:'signal-cli',     type:'[signal-cli-rest-api · signal]',desc:'Aparelho vinculado à conta Signal do bot',th:'sg new',drill:'n4-sig',hint:'ver canal'}));
  c.appendChild(nd({id:'db', x:60, y:480,w:152,icon:'🗄️',name:'PostgreSQL 16',   type:'[Banco de Dados · db]',desc:'Incidentes, anexos, usuários, inventário, auditoria append-only',th:'db'}));
  c.appendChild(nd({id:'ce', x:290,y:480,w:170,icon:'📨',name:'Celery + Redis',type:'[worker · beat · redis]',desc:'Entrega e-mail/Telegram/WhatsApp; SLA a cada 5 min; pub/sub do WebSocket',th:'que'}));
  c.appendChild(nd({id:'vol',x:535,y:530,w:170,icon:'📁',name:'Volumes',type:'[pgdata · media · whisper · waha · signal]',desc:'Banco, anexos, modelo Whisper e as sessões vinculadas',th:'db'}));

function tbl(heads,rows){
  return `<table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(cc=>`<td>${cc}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

// N4 Zabbix — integração geral
LEVELS['n4-zbx']=()=>n4panel('Zabbix — Integração com o Sistema','N1 · Sistema Externo → Sistema de Incidentes',`
  <h3>Visão geral</h3>
  <p style="font-size:11.5px;color:var(--muted);line-height:1.7">O Zabbix monitora a infraestrutura do datacenter (servidores, switches, links, UPS, temperatura etc.). Quando um problema é detectado, o Zabbix chama um webhook HTTP no endpoint do sistema, que cria um incidente automaticamente — sem intervenção humana. Quando o problema é resolvido, o Zabbix chama o mesmo webhook com evento de recuperação, e o sistema atualiza o incidente.</p>
  <h3>Fluxo de criação automática</h3>
  ${tbl(['Passo','Quem','Ação'],[
    ['1','Zabbix','Detecta problema (trigger dispara)'],
    ['2','Zabbix','Chama <code>POST /webhook/zabbix</code> com payload do alerta'],
    ['3','Zabbix Receiver','Valida token; extrai dados; determina criticidade'],
    ['4','Incidente Service','Cria incidente com canal=ZABBIX; calcula SLA'],
    ['5','Notificadores','Notifica grupo de atendimento por e-mail e WhatsApp'],
    ['6','Zabbix (recuperação)','Chama webhook com <code>event_value=0</code>'],
    ['7','Incidente Service','Fecha incidente automaticamente (ou sinaliza para revisão)'],
  ])}
  <h3>Mapeamento de severidade Zabbix → criticidade do sistema</h3>
  ${tbl(['Severity Zabbix','Criticidade no sistema','SLA sugerido'],[
    ['Disaster / High','ALTA','2 horas'],
    ['Average','MEDIA','1 dia útil'],
    ['Warning / Information','BAIXA','3 dias úteis'],
    ['Not classified','BAIXA','3 dias úteis'],
  ])}
  <h3>v6 — ambiente de teste local (implementado)</h3>
  ${tbl(['Item','Valor'],[
    ['Stack','<code>zabbix/docker-compose.yml</code>: Zabbix 7.0 (server, web em <code>localhost:8081</code>, PostgreSQL) na mesma rede do sistema'],
    ['Configuração','<code>scripts/zabbix_setup.py</code> (idempotente): media type webhook → <code>http://web/webhook/zabbix</code> com Bearer <code>ZABBIX_WEBHOOK_TOKEN</code>'],
    ['Ação','"Enviar ao Sistema de Incidentes": problema e recuperação, grupos <i>Incidentes - teste</i> e <i>Dispositivos</i>, severidade High ou maior'],
    ['Hosts','<code>srv-teste</code> (item trapper <code>teste.falha</code>) e dispositivos reais por ICMP no grupo Dispositivos'],
    ['Teste','<code>--problema</code> abre incidente ALTA; <code>--recuperar</code> fecha automaticamente'],
  ])}
  <div class="note zbx">O token de autenticação do webhook Zabbix é diferente do HMAC do WhatsApp. Configurar <code>ZABBIX_WEBHOOK_TOKEN</code> como variável de ambiente segura e rotacionar periodicamente.</div>
  <div class="note">📐 <b>Nota de layout no N1:</b> o Zabbix é desenhado à direita do Sistema de Incidentes na mesma faixa vertical (y≈310), não abaixo junto aos outros externos (WhatsApp API, Google OAuth, STT, SMTP que ficam em y≈480). Isso é intencional — a seta <code>webhook HTTP</code> flui horizontalmente (Zabbix→Sistema, da direita para o centro), refletindo que o Zabbix envia dados ativamente para o sistema. Algoritmos de detecção puramente por eixo Y podem classificar erroneamente Zabbix e Sistema como no mesmo nível — a verificação correta é pelo eixo X (Zabbix x≥730, Sistema x=290..490).</div>`);

// N4 Zabbix Receiver (componente da API)
LEVELS['n4-zbr']=()=>n4panel('Zabbix Receiver','API Backend · Componente',`
  <h3>Responsabilidades</h3>
  <p style="font-size:11.5px;color:var(--muted);line-height:1.7">Ponto de entrada dos alertas automáticos do Zabbix. Valida token estático no header <code>Authorization: Bearer &lt;token&gt;</code>. Converte o payload do Zabbix para o modelo de incidente do sistema. Idempotente: usa <code>event_id</code> do Zabbix para evitar incidentes duplicados em reenvios.</p>
  <h3>Endpoint e respostas</h3>
  ${tbl(['Rota','Método','Auth','Erros possíveis'],[
    ['<code>/webhook/zabbix</code>','<span class="tag POST">POST</span>','Bearer token estático','403 token inválido · 422 payload incompleto'],
  ])}
  <h3>Validação de payload</h3>
  ${tbl(['Campo obrigatório','Ausente → retorna'],[
    ['<code>event_id</code>','422 Unprocessable Entity'],
    ['<code>severity</code> (quando event_value=1)','422 Unprocessable Entity'],
    ['<code>event_value</code>','422 Unprocessable Entity'],
  ])}
  <div class="note zbx">Severidade não mapeada (ex: "Not classified") usa <strong>fallback para BAIXA</strong> em vez de rejeitar — confirmado em testes. Isso evita que alertas desconhecidos sejam silenciados.</div>
  <h3>Payload recebido do Zabbix (exemplo)</h3>
  <pre>{
  "event_id":    "12345",
  "event_value": "1",          // 1=problema, 0=recuperação
  "trigger_name":"CPU acima de 90% — servidor-db01",
  "severity":    "High",
  "host":        "servidor-db01",
  "host_ip":     "192.168.1.10",
  "trigger_url": "https://zabbix.cesup.ufrgs.br/...",
  "timestamp":   "1731000000"
}</pre>
  <h3>Lógica de idempotência</h3>
  ${tbl(['Campo','Uso'],[
    ['<code>event_id</code>','Chave única por evento; armazenado no incidente como <code>ref_externa</code>'],
    ['<code>event_value=1</code>','Cria incidente (se <code>ref_externa</code> ainda não existir)'],
    ['<code>event_value=0</code>','Fecha incidente correspondente automaticamente'],
  ])}
  <h3>Logs de auditoria gerados (fluxo completo Zabbix)</h3>
  ${tbl(['Ordem','Ação','usuario_id','canal'],[
    ['1','CRIAR_INCIDENTE','null (sistema)','ZABBIX'],
    ['2','ESCALONAR_INCIDENTE (se SLA vencer)','null (sistema)','SISTEMA'],
    ['3','ATENDER_INCIDENTE (técnico assume)','usr-xxx','WEB'],
    ['4','FECHAR_AUTOMATICO (event_value=0) ou RESOLVER_INCIDENTE','null ou usr-xxx','ZABBIX ou WEB'],
  ])}
  <div class="note zbx">Incidentes criados pelo Zabbix têm <code>aberto_por_id=null</code> e <code>usuario_id=null</code> no log de auditoria — confirmado em testes. Técnico ainda precisa registrar resolução manual se o problema não se recuperar automaticamente via <code>event_value=0</code>.</div>`);

LEVELS['n4-whr']=()=>n4panel('Webhook Receiver','Bot · Componente da WhatsApp Cloud API (desligada)',`
  <div class="note off">⏸️ <b>Cloud API desligada desde 17/11/2026:</b> a Meta bloqueou a conta de desenvolvedor. O código continua no bot e testado (<code>WA_MODE=cloud</code> o religa). <b>v7:</b> o WhatsApp voltou a funcionar pela ponte WAHA (<code>WA_MODE=waha</code>), que entra por <code>POST /webhook/waha</code> — ver <i>WAHA Adapter</i>.</div>
  <h3>Responsabilidades</h3>
  <p style="font-size:11.5px;color:var(--muted);line-height:1.7">Ponto de entrada de eventos do WhatsApp (exposto pelo nginx em <code>/webhook/whatsapp</code>; nos testes, via Cloudflare quick tunnel). Valida a assinatura HMAC-SHA256 no header <code>X-Hub-Signature-256</code> e rejeita com 403 se inválida. Processa o evento em segundo plano (tarefa Celery <code>bot.processar</code> ou <code>BackgroundTasks</code>) e retorna 200 <strong>imediatamente</strong>. O evento traz só o <code>media_id</code>, não o arquivo.</p>
  <h3>Endpoints</h3>
  ${tbl(['Rota','Método','Descrição','Auth'],[
    ['<code>/webhook/whatsapp</code>','<span class="tag GET">GET</span>','Verificação de token (setup inicial do webhook)','Token fixo'],
    ['<code>/webhook/whatsapp</code>','<span class="tag POST">POST</span>','Recebe eventos de mensagem','HMAC-SHA256'],
  ])}
  <h3>Tipos de evento e roteamento</h3>
  ${tbl(['Tipo de mensagem','Campo <code>type</code>','Próximo passo'],[
    ['Texto digitado','<code>text</code>','→ Remetente Checker → Intent Parser'],
    ['Áudio (voz)','<code>audio</code>','→ Remetente Checker → Media Downloader → STT → Intent Parser'],
    ['Foto','<code>image</code>','→ Remetente Checker → Media Downloader → Gerenciador de Anexos (e OCR se for cadastro)'],
    ['Vídeo','<code>video</code>','→ Media Downloader → STT (trilha de áudio) → Intent Parser; arquivo vira anexo'],
    ['Documento (PDF, DOCX, XLSX, ODT, TXT, CSV…)','<code>document</code>','→ Media Downloader → Gerenciador de Anexos'],
    ['Resposta a botão/lista','<code>interactive</code>','→ Remetente Checker → Intent Parser'],
    ['Outros (sticker, localização…)','qualquer outro','→ Sender: "formato não suportado"'],
  ])}
  <div class="note">Eventos de status de entrega (<code>statuses</code>) são ignorados silenciosamente — apenas mensagens são processadas.</div>`);

LEVELS['n4-ach']=()=>n4panel('Remetente Checker','Bot · Componente (todos os canais)',`
  <div class="note sg">🔵 <b>v7 — WAHA e Signal:</b> a pessoa é reconhecida pelo celular do Perfil (com ou sem o nono dígito). Como o número do bot pode ser de uma pessoa, mensagens de quem <b>não tem cadastro são ignoradas em silêncio</b> (nenhuma resposta). O log registra só os 4 últimos dígitos (ex.: <code>final 5991</code>), para o admin conferir o cadastro sem gravar o número inteiro.</div>
  <h3>Responsabilidades</h3>
  <p style="font-size:11.5px;color:var(--muted);line-height:1.7">Identifica o usuário do sistema pelo número de WhatsApp do remetente. Consulta o <strong>Usuario Service</strong> na API Backend. Bloqueia o fluxo se o número não estiver cadastrado ou se o usuário estiver inativo.</p>
  <h3>Fluxo de verificação</h3>
  ${tbl(['Situação','HTTP','Ação'],[
    ['Número encontrado e usuário ativo','200','Injeta <code>usuario_id</code> no contexto; passa adiante'],
    ['Número não cadastrado','<b>404</b>','WA Sender: "Seu número não está cadastrado. Fale com a TI."'],
    ['Usuário bloqueado','<b>403</b>','WA Sender: "Seu acesso está suspenso. Entre em contato com o administrador."'],
  ])}
  <h3>Consulta à API</h3>
  <p style="font-size:11px;color:var(--muted);line-height:1.7;margin-top:8px"><code>GET /usuarios/by-whatsapp?numero={remetente}</code> — rota interna, autenticada por token de serviço (não JWT de usuário). Resultado é cacheado por 60 s por número para reduzir chamadas.</p>
  <div class="note">O número de WhatsApp vinculado ao perfil é cadastrado pelo próprio usuário via <code>PUT /usuarios/me/whatsapp</code> na interface web.</div>
  <h3>v6 — Telegram (TelegramChecker)</h3>
  ${tbl(['Situação','Ação'],[
    ['chat_id vinculado e usuário ativo','Segue para o Processor (chave <code>tg:&lt;chat_id&gt;</code>)'],
    ['chat_id desconhecido (404)','Boas-vindas + teclado <b>📱 Compartilhar meu número</b>'],
    ['Contato de outra pessoa','"Envie o SEU contato" — recusado'],
    ['Número não cadastrado em nenhum perfil','"Cadastre seu celular em Perfil" + pede o contato de novo'],
    ['Usuário bloqueado (403)','Mensagem de acesso suspenso'],
  ])}
  <div class="note">Correção v6: o cache guarda <b>só resultados positivos</b> (60 s). Antes, um 404 ficava em cache e quem acabara de cadastrar o celular continuava "não cadastrado".</div>`);

LEVELS['n4-mdl']=()=>n4panel('Media Downloader','Bot WhatsApp · Componente',`
  <h3>Responsabilidades</h3>
  <p style="font-size:11.5px;color:var(--muted);line-height:1.7">O WhatsApp não envia o arquivo de mídia no webhook — apenas um <code>media_id</code>. Este componente faz duas chamadas à API do WhatsApp: primeiro obtém a URL temporária do arquivo, depois baixa os bytes. A URL expira em ~5 minutos, por isso o download deve ser imediato.</p>
  <h3>Fluxo</h3>
  ${tbl(['Passo','Chamada','Resultado'],[
    ['1','<code>GET /media/{media_id}</code> (API WhatsApp)','Retorna <code>url</code> temporária e <code>mime_type</code>'],
    ['2','<code>GET {url}</code> com header <code>Authorization: Bearer {token}</code>','Retorna bytes do arquivo'],
    ['3','Roteia pelo <code>mime_type</code>','<code>audio/*</code> → STT Adapter; <code>image/*</code> → Intent Parser com bytes'],
  ])}
  <h3>Tipos de mídia suportados</h3>
  ${tbl(['MIME type','Destino'],[
    ['<code>audio/ogg</code>, <code>audio/mpeg</code>, <code>audio/mp4</code>','STT Adapter'],
    ['<code>image/jpeg</code>, <code>image/png</code>, <code>image/webp</code>','Gerenciador de Anexos (FOTO); OCR no cadastro de equipamento'],
    ['<code>video/mp4</code>, <code>video/3gpp</code>, <code>video/quicktime</code>','STT (trilha de áudio) + Gerenciador de Anexos (VIDEO)'],
    ['PDF, DOC/DOCX, XLS/XLSX, ODT/ODS, TXT, CSV','Gerenciador de Anexos (DOCUMENTO), com o nome original'],
  ])}
  <div class="note tg">✈️ <b>Telegram:</b> <code>TelegramMedia</code> usa <code>getFile</code> + download em <code>/file/bot&lt;token&gt;/…</code> (até 20 MB pela Bot API). O token fica na URL: URLs nunca vão para o log.</div>
  <div class="note">Falha no download (URL expirada, timeout) → WA Sender: "Não consegui processar sua mídia. Tente enviar novamente."</div>`);

LEVELS['n4-stt']=()=>n4panel('STT Adapter','Bot WhatsApp · Componente',`
  <h3>Responsabilidades</h3>
  <p style="font-size:11.5px;color:var(--muted);line-height:1.7">Abstrai o motor de transcrição de voz. Recebe bytes de áudio e retorna texto em português. A escolha do backend é feita via variável de ambiente, sem mudança de código.</p>
  <h3>Backends disponíveis</h3>
  ${tbl(['Backend','Variável','Latência','Privacidade','Recomendação'],[
    ['Whisper local (CPU)','<code>STT_BACKEND=local</code>','5–15 s','Total — sem envio externo','Produção (privacidade)'],
    ['Whisper local (GPU)','<code>STT_BACKEND=local_gpu</code>','1–3 s','Total','Produção (performance)'],
    ['OpenAI Whisper API','<code>STT_BACKEND=openai</code>','1–2 s','Áudio vai à OpenAI','Testes iniciais'],
  ])}
  <h3>Implementação em uso (v6)</h3>
  ${tbl(['Item','Valor'],[
    ['Backend','<code>STT_BACKEND=local</code> — faster-whisper, modelo <code>small</code>, CPU <code>int8</code>, idioma pt'],
    ['Cache do modelo','Volume <code>whisper</code> (baixado uma vez); pré-aquecido em segundo plano na subida do bot'],
    ['Vocabulário de TI','<code>STT_VOCABULARIO</code> passado como <code>hotwords</code> ("switch", "nobreak", "rack", "patrimônio"…) — "switch" deixou de sair "SWIT"'],
    ['Vídeo','A trilha de áudio do vídeo é transcrita com o mesmo modelo (PyAV); o vídeo vira anexo'],
    ['Dependência','PyAV fixado em <code>av&gt;=11,&lt;16</code> (a 16+ removeu <code>metadata_errors</code> usado pelo faster-whisper)'],
    ['Limpeza','Arquivos temporários removidos após cada transcrição; erros agora vão para o log'],
    ['Compartilhado','Um único modelo atende WhatsApp e Telegram'],
  ])}
  <h3>Interface do componente</h3>
  <pre>transcribe(audio_bytes: bytes, lang: str = "pt") -> str
# Lança STTError em caso de falha (timeout, modelo indisponível)</pre>
  <div class="note">Em falha do STT → WA Sender: "Não consegui transcrever seu áudio. Tente digitar a mensagem." O usuário nunca fica sem resposta.</div>`);

  <p style="font-size:11.5px;color:var(--muted);line-height:1.7">Recebe o texto (transcrito ou digitado) mais o contexto do remetente e classifica a intenção. Extrai os dados necessários e chama o API Client com a operação correspondente.</p>

    ['REGISTRAR_INCIDENTE','"caiu", "problema", "não funciona", "sem energia", "queimou", "sem resposta"','descrição, criticidade inferida','<code>POST /incidentes</code>'],
    ['CONSULTAR_INCIDENTE','"status", "meu chamado", "protocolo", "abertos"','número do protocolo (se mencionado)','<code>GET /incidentes?aberto_por=me</code>'],
    ['RESOLVER_INCIDENTE','"resolvido", "funcionando", "ok já", "corrigi"','id do incidente aberto','<code>POST /incidentes/{id}/resolver</code>'],
    ['CADASTRAR_ATIVO','"patrimônio", "patrimonio", "equipamento", "computador"','número de patrimônio (se detectado)','<code>POST /ativos</code>'],
    ['AJUDA','"ajuda", "o que posso", "?", "como"','—','WA Sender: menu de opções'],

  <div class="note tg">✅ <b>v1.1 (implementado):</b> texto e palavras sem acentos e em minúsculas; a palavra precisa <b>começar</b> numa palavra do texto mas pode continuar (<code>queimad</code> casa "queimada"/"queimado"; <code>erro</code> casa "erros" mas não "ferro"); terminada em <code>!</code> exige a palavra inteira (<code>agua!</code> não casa "aguardando"); palavras de RESOLVER negadas até 2 palavras antes ("não está funcionando") não contam. ~70 palavras de REGISTRAR (rede, energia, erros, lentidão, água, fumaça, temperatura…). A limitação abaixo era do v1.</div>

  <h3>Estratégia de classificação</h3>

  <em>Motivo: "problema resolvido" contém tanto "problema" (REGISTRAR) quanto "resolvido" (RESOLVER). Verificando RESOLVER primeiro, a intenção correta é capturada. Confirmado em testes.</em></p>

  ${tbl(['Serviço','Imagem','Porta / acesso','Observação'],[
    ['<code>web</code>','nginx + SPA (build próprio)','<code>PAINEL_PORTA</code> (padrão 8080)','Proxy de /api, /ws, /webhook'],
    ['<code>api</code>','Python/FastAPI (build)','interna :8000','Migrações Alembic no boot; ws-relay'],
    ['<code>worker</code> · <code>beat</code>','mesma base da API','—','Entregas e SLA a cada 5 min'],
    ['<code>bot</code>','Python/FastAPI (build)','interna :8001','Telegram, WAHA, Signal; Whisper local'],
    ['<code>db</code> · <code>redis</code>','postgres:16-alpine · redis:7-alpine','internas','Healthchecks'],
    ['<code>waha</code>','devlikeapro/waha','127.0.0.1:3000','Perfil <code>whatsapp-web</code>'],

  <h3>Instalador (PR #12)</h3>
